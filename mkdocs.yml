site_name: Project Manager Mastery Path
site_description: A structured, module-wise project management training program from entry level to master level, with real frameworks and templates in every module.
site_url: https://sigilipelli.github.io/project-manager-mastery-path/
repo_url: https://github.com/SIGILIPELLI/project-manager-mastery-path
repo_name: project-manager-mastery-path

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · What Is Project Management?": level-1/01-what-is-project-management.md
      - "02 · Project Lifecycle Basics": level-1/02-project-lifecycle-basics.md
      - "03 · Scope Management Basics": level-1/03-scope-management-basics.md
      - "04 · Scheduling Basics": level-1/04-scheduling-basics.md
      - "05 · Budget & Cost Basics": level-1/05-budget-cost-basics.md
      - "06 · Risk Management Basics": level-1/06-risk-management-basics.md
      - "07 · Stakeholder Management Basics": level-1/07-stakeholder-management-basics.md
      - "08 · Communication Plans": level-1/08-communication-plans.md
      - "09 · Tools Overview (Jira, MS Project, Asana)": level-1/09-tools-overview.md
      - "10 · Project — Full Charter & Schedule": level-1/10-project-charter-schedule.md
# --- auto-pruned stub levels (see AdSense low-value-content fix) ---
exclude_docs: |
  level-2/*.md
  level-3/*.md
  level-4/*.md
